name: CI

on:
  push:
    branches: [ "main", "macos" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: the arm64 pool (macos-latest) often can't place jobs.
        # The build is universal either way.
        os: [ ubuntu-latest, macos-15-intel ]
    steps:
      - uses: actions/checkout@v6

      - name: Install CUPS headers (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev libcupsimage2-dev cups-client gcc

      - name: Validate PPDs
        run: cupstestppd -W filters ppd/*.ppd

      - name: Check shell scripts
        run: for f in packaging/*.sh tests/*.sh detect_printer.sh test_print.sh; do bash -n "$f"; done

      - name: Unit and integration tests (>= 95% line coverage)
        run: make test

      - name: Build with -Werror
        run: make clean && make CFLAGS="-O2 -Wall -Wextra -Werror" build

  package:
    name: macOS package
    needs: test
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      HAVE_SIGNING: ${{ secrets.APP_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import signing certificates
        if: env.HAVE_SIGNING == 'true'
        env:
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          for c in APP_CERT_P12 INSTALLER_CERT_P12; do
            echo "${!c}" | base64 --decode > "$RUNNER_TEMP/$c.p12"
            security import "$RUNNER_TEMP/$c.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/$c.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          # keep existing keychains in the search list (word splitting intended)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials ricoh-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KC"
          {
            echo "APP_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            echo "PKG_SIGN_IDENTITY=$(security find-identity -v -p basic "$KC" | awk -F'"' '/Developer ID Installer/ {print $2; exit}')"
            echo "NOTARY_PROFILE=ricoh-notary"
            echo "NOTARY_KEYCHAIN=$KC"
          } >> "$GITHUB_ENV"

      - name: Build package
        run: make pkg

      - uses: actions/upload-artifact@v6
        with:
          name: ricoh-ddst-driver-pkg
          path: dist/*.pkg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/*.pkg > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
